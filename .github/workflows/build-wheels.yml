name: Build wheels

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0,3' # 2/weekly

jobs:
  build_wheels:
    name: ${{ matrix.os }}, ${{matrix.python_impl }} ${{ matrix.python }}${{ matrix.variant == 'musllinux' && ', musllinux' || '' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Every job builds a single wheel. Linux x86_64 has two wheels for each
        # Python (manylinux and musllinux), so it has two jobs; the musllinux
        # job is the one with variant musllinux. Linux aarch64 is built natively
        # on an ARM runner. See CIBW_SKIP and CIBW_ARCHS_LINUX below.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel, windows-11-arm]
        python: [cp310, cp311, cp312, cp313, cp314, cp314t, cp315, cp315t]
        python_impl: [Python]
        variant: [default, musllinux]
        include:
          - python: cp313
            os: ubuntu-latest
            python_impl: Pyodide
        exclude:
          - os: windows-11-arm
            python: cp310
          - os: windows-11-arm
            python: cp311
          - os: windows-11-arm
            python: cp312
          # No musllinux wheels for aarch64 and no separate musllinux job
          # outside of Linux x86_64
          - os: ubuntu-24.04-arm
            variant: musllinux
          - os: windows-latest
            variant: musllinux
          - os: macos-latest
            variant: musllinux
          - os: macos-15-intel
            variant: musllinux
          - os: windows-11-arm
            variant: musllinux
    env:
      BUILD_COMMIT: "main"  # or a specific version, e.g., v0.13.1
      CIBW_BUILD: ${{ matrix.python }}-*
      CIBW_ENABLE: cpython-prerelease
      # Build only for the architecture of the runner, so each job builds a
      # single wheel and nothing runs under emulation
      CIBW_ARCHS_LINUX: native
      CIBW_ARCHS_MACOS: native
      # No support for Win32 for 3.10+
      # The musllinux variant builds only musllinux wheels, all other jobs
      # build no musllinux wheel (so there is no musllinux aarch64 wheel)
      CIBW_SKIP: "*-win32 ${{ matrix.variant == 'musllinux' && '*manylinux*' || '*musllinux*' }}"
      CIBW_TEST_REQUIRES: pytest pytest-randomly threadpoolctl pytest-run-parallel pandas<3.1
      CIBW_TEST_COMMAND: python -c "import numpy, scipy, statsmodels.api; numpy.show_runtime(); numpy.show_config(); scipy.show_config(); statsmodels.test(['-m','(not slow and not example)','--randomly-dont-reset-seed'], exit=True)"
      # Avoid testing on emulated architectures and Pyodide
      # Skip testing for now on Windows ARM11 due to linalg segfaults upstream
      CIBW_TEST_SKIP: "*-*linux_{aarch64,ppc64le,s390x}"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: 'auditwheel repair --strip -w {dest_dir} {wheel}'
      CIBW_BUILD_VERBOSITY: 1
      MULTIBUILD_WHEELS_STAGING_ACCESS: ${{ secrets.MULTIBUILD_WHEELS_STAGING_ACCESS }}
      SCIENTIFIC_PYTHON_NIGHTLY_WHEELS: ${{ secrets.SCIENTIFIC_PYTHON_NIGHTLY_WHEELS }}
      IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
      IS_PUSH: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build wheels (Default)
        uses: pypa/cibuildwheel@v4.3
        if: (matrix.python_impl != 'Pyodide')
        with:
          output-dir: wheelhouse
          package-dir: statsmodels
        env:
          CIBW_BEFORE_BUILD: 'git submodule foreach git checkout  ${{ env.BUILD_COMMIT }}'

      - name: Build Pyodide wheel
        if: matrix.python_impl == 'Pyodide'
        uses: pypa/cibuildwheel@v4.3
        with:
          output-dir: wheelhouse
          package-dir: statsmodels
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: "cp313-*"
          CIBW_BEFORE_BUILD: 'git submodule foreach git checkout  ${{ env.BUILD_COMMIT }}'
          CIBW_TEST_COMMAND: python -c "import statsmodels; statsmodels.test(['-sra', '--skip-examples', '--skip-slow', '--randomly-dont-reset-seed'], exit=True)"
          CIBW_TEST_REQUIRES: pytest pytest-cov pytest-run-parallel pytest-randomly matplotlib

      - name: Setup Upload Variables
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "schedule" == "${{ github.event_name }}" ] || [ "push" == "${{ github.event_name }}" ]; then
            echo "Upload to Anaconda"
            echo "ANACONDA_UPLOAD=true" >> $GITHUB_ENV
          else
            echo "Do not upload to Anaconda"
            echo "ANACONDA_UPLOAD=false" >> $GITHUB_ENV
          fi
          echo "Set upload for scientific-python-nightly-wheels"q
          echo "ANACONDA_ORG=scientific-python-nightly-wheels" >> $GITHUB_ENV
          echo "TOKEN=$SCIENTIFIC_PYTHON_NIGHTLY_WHEELS" >> $GITHUB_ENV

      - name: Install conda
        uses: conda-incubator/setup-miniconda@v4
        if: (runner.os != 'Windows') || ((runner.os == 'Windows') && (runner.arch != 'ARM64'))
        with:
          # for installation of anaconda-client, required for upload to
          # anaconda.org
          # default (and activated) environment name is test
          # Note that this step is *after* specific pythons have been used to
          # build and test the wheel
          auto-update-conda: true
          python-version: "3.12"
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Inspect conda and install anaconda-client
        shell: pwsh
        if: (runner.os != 'Windows') || ((runner.os == 'Windows') && (runner.arch != 'ARM64'))
        run: |
          conda info
          conda list
          conda install -y anaconda-client

      - name: Install anaconda-client (Windows ARM64)
        shell: pwsh
        if: ((runner.os == 'Windows') && (runner.arch == 'ARM64'))
        run: |
          python -m pip install pip -U
          pip install --only-binary :all: anaconda-client

      - name: Upload wheels
        if: ${{ always() }}
        shell: pwsh
        run: |
          # trigger an upload to the shared ecosystem
          # infrastructure at: https://anaconda.org/scientific-python-nightly-wheels
          # for cron jobs only (restricted to main branch once
          # per week)
          # SCIENTIFIC_PYTHON_NIGHTLY_WHEELS is a secret token
          # used in Travis CI config, originally
          #
          # for merges (push events) we use the staging area instead;
          # MULTIBUILD_WHEELS_STAGING_ACCESS is a secret token used in Travis
          # CI config, originally generated at anaconda.org for
          # multibuild-wheels-staging
          # generated at anaconda.org for scientific-python-nightly-wheels
          echo ${PWD}
          if ( $env:ANACONDA_UPLOAD -eq "true")
          {
            echo "Uploading to $env:ANACONDA_ORG"
            # main branches of these two packages
            ls ./wheelhouse/*.whl
            anaconda --verbose -t $env:TOKEN upload --force -u $env:ANACONDA_ORG ./wheelhouse/*.whl
            echo "PyPI-style index: https://pypi.anaconda.org/$ANACONDA_ORG/simple"
          }
